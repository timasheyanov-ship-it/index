  BLK=g;lsSet("madlab_blk",JSON.stringify(BLK));applyBlk();
  if(!same){beat();if(BLK.length)toast("🔒 Админ заблокировал часть кнопок.");else toast("🔓 Кнопки разблокированы.")}
}
function applyBlk(){
  var m=document.querySelectorAll("[data-lvb]");
  for(var i=0;i<m.length;i++){m[i].removeAttribute("data-lvb");if(m[i].hasAttribute("data-lvd")){m[i].disabled=false;m[i].removeAttribute("data-lvd")}}
  if(!BLK.length)return;
  BLK.forEach(function(g){
    var l;try{l=document.querySelectorAll(SEL[g])}catch(e){return}
    for(var i=0;i<l.length;i++){var e=l[i];if(e.closest(KEEP))continue;e.setAttribute("data-lvb","1");if("disabled" in e&&!e.disabled){e.disabled=true;e.setAttribute("data-lvd","1")}}
  });
}
function stopEv(e){if(blocked(e.target)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}}
["click","mousedown","pointerdown","touchstart","touchend","dblclick","input","change"].forEach(function(n){document.addEventListener(n,stopEv,{capture:true,passive:false})});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&blocked(e.target))stopEv(e)},true);

/* --- сообщение и видео --- */
var toastT=0;
function toast(s){
  var m=$("#livemsg");if(!m)return;
  var d=$("#livetoast");if(!d){d=document.createElement("div");d.id="livetoast";d.style.cssText="position:fixed;left:50%;top:12px;transform:translateX(-50%);max-width:92vw;background:var(--pn);border:1px solid var(--n3);border-radius:12px;padding:8px 14px;z-index:140;font-size:14px;display:none";document.body.appendChild(d)}
  d.textContent=s;d.style.display="block";clearTimeout(toastT);toastT=setTimeout(function(){d.style.display="none"},3500);
}
function ensureOv(){
  if(!$("#liveov")){var v=document.createElement("div");v.id="liveov";document.body.appendChild(v)}
  if(!$("#livemsg")){var m=document.createElement("div");m.id="livemsg";m.innerHTML='<div class="bx"><b>📢 Сообщение от админа</b><p id="livemsgt"></p><button class="go" id="livemsgok">Понятно</button></div>';document.body.appendChild(m);
    $("#livemsgok").onclick=function(){m.classList.remove("on");ev("прочитал сообщение")}}
}
function showMsg(t){ensureOv();$("#livemsgt").textContent=t;$("#livemsg").classList.add("on");ev("получил сообщение");try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}}
function ytId(u){
  var m=/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/.exec(u);
  return m?m[1]:null;
}
function playVideo(src,lock){
  ensureOv();var o=$("#liveov"),id=ytId(src);
  if(!/^https?:\/\//i.test(src)){return}
  stopVideo(true);
  var html=lock?"":'<button class="x" id="liveovx">✕ Закрыть</button>';
  if(id)html+='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
  else html+='<video id="livevid" src="'+esc(src)+'" autoplay playsinline controls></video>';
  o.innerHTML=html;o.classList.add("on");vidOn=true;
  var x=$("#liveovx");if(x)x.onclick=function(){stopVideo();ev("закрыл видео")};
  var v=$("#livevid");
  if(v){
    var p=v.play&&v.play();
    if(p&&p.catch)p.catch(function(){v.muted=true;v.play().catch(function(){})});
    v.onended=function(){ev("досмотрел видео")};
    v.onerror=function(){ev("видео не открылось (ссылка не mp4?)")};
  }
  ev("смотрит видео");beat();
}
function stopVideo(silent){
  var o=$("#liveov");if(!o)return;
  o.classList.remove("on");o.innerHTML="";
  if(vidOn){vidOn=false;if(!silent)beat()}
}

/* ================= админ ================= */
var unlocked=false;try{unlocked=sessionStorage.getItem("madlab_adm")==="1"}catch(e){}
var users={},evs=[],selId=null,all=false,desired={},lastPush={},nextCid=0;
try{desired=JSON.parse(lsGet("madlab_desired")||"{}")}catch(e){desired={}}
function saveDesired(){lsSet("madlab_desired",JSON.stringify(desired))}
function admHb(o){
  if(!o||!o.id||o.id===PID)return;
  if(o.bye){if(users[o.id])users[o.id].seen=0;return}
  var u=users[o.id]||(users[o.id]={first:now()});
  u.d=o;u.seen=now();
  if(desired[o.id]===undefined&&desired["*"]&&desired["*"].length){desired[o.id]=desired["*"].slice();saveDesired()}
  /* админ главный: если у игрока не такое состояние блокировки, как задумано, отправляем заново */
  var want=(desired[o.id]||[]).join(",");
  if(String(o.blk||"")!==want&&now()-(lastPush[o.id]||0)>15000){lastPush[o.id]=now();send(o.id,{k:"block",g:desired[o.id]||[]},true)}
}
function admEv(o){if(!o||!o.id)return;evs.unshift({id:o.id,name:o.name||o.id,txt:o.txt,ts:o.ts||now()});if(evs.length>60)evs.length=60}
function send(to,c,quiet){
  c.to=to;c.cid=PID+now().toString(36)+(nextCid++);
  var ok=pub(T_CMD,c);
  if(!quiet)flash(ok?"Отправлено":"Нет связи с сервером: подожди секунду и повтори");
  return ok;
}
function flash(s){var f=$("#lvFlash");if(f){f.textContent=s;clearTimeout(flash.t);flash.t=setTimeout(function(){f.textContent=""},3000)}}
function online(){var r=[];for(var k in users){var u=users[k];if(u.seen&&now()-u.seen<ONLINE_MS)r.push(u)}return r.sort(function(a,b){return a.first-b.first})}
function ago(ms){var s=Math.max(0,Math.round(ms/1000));if(s<60)return s+" с";var m=Math.floor(s/60);if(m<60)return m+" мин";return Math.floor(m/60)+" ч "+(m%60)+" мин"}
function grpTxt(a){return a&&a.length?a.map(function(g){var f=GROUPS.filter(function(x){return x[0]===g})[0];return f?f[1]:g}).join(", "):"нет"}

function isOpen(){var a=$("#adm");return !!a&&a.classList.contains("on")}
function paintConn(){
  var l=$("#lvLed");if(l)l.className="led "+(connected?"ok":"bad");
  var t=$("#lvConn");if(t)t.textContent=connected?("Связь есть · "+BROKERS[bi%BROKERS.length].replace(/^wss:\/\//,"").split("/")[0]):"Подключаюсь к серверу…";
}
var lastList="";
function paintList(){
  if(!isOpen()||!unlocked)return;
  paintConn();
  var on=online(),n=$("#lvCount");if(n)n.textContent=on.length;
  var h='<button data-u="*" class="'+(all?"on":"")+'">📣 <b>Все, кто онлайн</b> <small>('+on.length+')</small></button>';
  on.forEach(function(u){var d=u.d||{},b=(desired[d.id]||[]);
    h+='<button data-u="'+esc(d.id)+'" class="'+(!all&&selId===d.id?"on":"")+'">'+esc(d.dev||"")+' <b>'+esc(d.name)+'</b> · ур. '+(d.lvl||"?")+' <small>· '+esc(d.tab||"")+' · '+ago(now()-(d.t0||u.first))+(d.vid?" · ▶ видео":"")+(b.length?" · 🔒":"")+'</small></button>'});
  if(!on.length)h+='<div class="mut" style="margin:8px 0">Сейчас на сайте никого, кроме тебя. Список обновляется сам.</div>';
  if(h!==lastList){var l=$("#lvList");if(l){l.innerHTML=h;lastList=h}}
  paintInfo();
}
function paintInfo(){
  var el=$("#lvInfo");if(!el)return;
  if(all){var on=online();el.innerHTML='Действия применятся ко всем, кто онлайн (<b>'+on.length+'</b>).';return}
  var u=users[selId],d=u&&u.d;
  if(!d){el.innerHTML='<span class="mut">Выбери игрока из списка.</span>';return}
  var isOn=u.seen&&now()-u.seen<ONLINE_MS;
  el.innerHTML=(isOn?'🟢 онлайн':'⚪ вышел (был '+ago(now()-(u.seen||u.first))+' назад)')+'<br>'+
   '<b>'+esc(d.name)+'</b> · '+esc(d.dev)+' · экран '+d.w+'×'+d.h+' · '+esc(d.lang||"")+'<br>'+
   'Дверь №'+(d.lvl||"?")+' · опыт '+(d.xp||0)+' · веществ открыто '+(d.disc||0)+' · опытов '+(d.tests||0)+' · взрывов '+(d.boom||0)+' · погибших мышей '+(d.dead||0)+'<br>'+
   'Сейчас: вкладка «'+esc(d.tab||"—")+'»'+(d.mix?' · в колбе: '+esc(d.mix):'')+'<br>'+
   'На сайте: '+ago(now()-(d.t0||u.first))+' · блокировка: '+esc(grpTxt(desired[d.id]))+(d.vid?' · ▶ смотрит видео':'');
}
function paintEv(){
  var e=$("#lvEv");if(!e)return;
  var l=evs.filter(function(x){return all||!selId||x.id===selId}).slice(0,12);
  e.innerHTML=l.length?l.map(function(x){return esc(new Date(x.ts).toLocaleTimeString())+" · "+esc(x.name)+": "+esc(x.txt)}).join("<br>"):"Пока тихо";
}
function targets(){return all?online().map(function(u){return u.d.id}):(selId?[selId]:[])}
function pushBlk(ids,g){ids.forEach(function(id){desired[id]=g.slice();send(id,{k:"block",g:g},true)});saveDesired();flash(ids.length?"Блокировка обновлена":"Выбери игрока")}
function renderDet(){
  var d=$("#lvDet");if(!d)return;
  var cur=all?(desired["*"]||[]):(desired[selId]||[]);
  d.innerHTML='<div id="lvInfo"></div>'+
   '<h4>💬 Сообщение</h4><textarea id="lvText" rows="2" placeholder="Текст, который появится у игрока на экране"></textarea>'+
   '<div class="b"><button class="go" data-a="msg">Отправить</button></div>'+
   '<h4>🔒 Блокировка кнопок (нажми, чтобы включить или выключить)</h4><div class="b lvchips">'+
   GROUPS.map(function(g){return'<button data-g="'+g[0]+'" class="'+(cur.indexOf(g[0])>=0?"on":"")+'">'+esc(g[1])+'</button>'}).join("")+
   '</div><div class="b"><button data-a="unblock">🔓 Разблокировать всё</button></div>'+
   '<h4>▶ Видео</h4><input id="lvUrl" type="url" placeholder="Ссылка на mp4 или на YouTube" autocomplete="off">'+
   '<label class="mut" style="display:block;margin:6px 0"><input type="checkbox" id="lvLock"> игрок не сможет закрыть видео сам</label>'+
   '<div class="b"><button class="go" data-a="play">Включить видео</button><button data-a="stop" class="warn">⏹ Остановить</button></div>'+
   '<div class="mut" style="font-size:12px">mp4: прямая ссылка на файл (https://…/video.mp4). Файл с телефона не передать, сначала загрузи его в интернет.</div>'+
   '<h4>📋 Что делают игроки</h4><div id="lvEv"></div>';
  paintInfo();paintEv();
}
function renderAdmin(){
  var b=$("#admBody");if(!b)return;
  if(!unlocked){
    b.innerHTML='<div class="mut" style="margin:6px 0">Введи пароль администратора.</div><input id="admPw" type="password" placeholder="Пароль" autocomplete="off"><div class="b"><button data-a="login" class="go">Войти</button></div><div id="admPwErr" class="mut" style="color:#ff9a9a"></div>';
    return;
  }
  b.innerHTML='<div><span id="lvLed" class="led"></span> <span id="lvConn" class="mut"></span></div>'+
   '<div style="margin:8px 0;font-size:16px">👥 Сейчас онлайн: <b id="lvCount">0</b></div>'+
   '<div id="lvList"></div><div id="lvFlash" class="mut" style="min-height:18px;color:var(--n1)"></div><div id="lvDet"></div>';
  lastList="";renderDet();paintList();
}
function openAdmin(){
  ensureAdmin();var a=$("#adm");if(!a)return;
  renderAdmin();a.classList.add("on");
  if(unlocked)startAdmin();
  var p=$("#admPw");if(p)setTimeout(function(){try{p.focus()}catch(e){}},50);
}
function closeAdmin(){
  var a=$("#adm");if(a)a.classList.remove("on");
  if(isAdminHash()){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){location.hash=""}}
}
function startAdmin(){sub(T_HB);sub(T_EV);startLib()}
function act(btn){
  var a=btn.dataset.a;
  if(btn.dataset.u!==undefined){
    all=btn.dataset.u==="*";selId=all?null:btn.dataset.u;lastList="";renderDet();paintList();return;
  }
  if(btn.dataset.g){
    var key=all?"*":selId;if(!all&&!selId){flash("Сначала выбери игрока");return}
    var g=(desired[key]||[]).slice(),i=g.indexOf(btn.dataset.g);
    if(i>=0)g.splice(i,1);else g.push(btn.dataset.g);
    btn.classList.toggle("on",i<0);
    if(all){desired["*"]=g;pushBlk(targets(),g);targets().forEach(function(id){desired[id]=g.slice()});saveDesired()}
    else pushBlk([selId],g);
    return;
  }
  switch(a){
    case"login":var pw=$("#admPw");
      if(pw&&pw.value===ADMPW){unlocked=true;try{sessionStorage.setItem("madlab_adm","1")}catch(e){}renderAdmin();startAdmin()}
      else{var er=$("#admPwErr");if(er)er.textContent="Неверный пароль.";if(pw){pw.value="";pw.focus()}}break;
    case"msg":var t=($("#lvText").value||"").trim();if(!t){flash("Напиши текст");return}
      var ids=targets();if(!ids.length){flash("Выбери игрока");return}
      ids.forEach(function(id){send(id,{k:"msg",text:t},true)});flash("Сообщение отправлено: "+ids.length);$("#lvText").value="";break;
    case"unblock":var ids2=targets();if(!ids2.length){flash("Выбери игрока");return}
      if(all)desired["*"]=[];pushBlk(ids2,[]);renderDet();break;
    case"play":var u=($("#lvUrl").value||"").trim();
      if(!/^https?:\/\//i.test(u)){flash("Нужна ссылка, начинающаяся с https://");return}
      var ids3=targets();if(!ids3.length){flash("Выбери игрока");return}
      ids3.forEach(function(id){send(id,{k:"video",src:u,lock:$("#lvLock").checked},true)});flash("Видео запущено у: "+ids3.length);break;
    case"stop":var ids4=targets();ids4.forEach(function(id){send(id,{k:"stop"},true)});flash("Видео остановлено");break;
  }
}
function ensureAdmin(){
  if($("#adm")||!document.body)return;
  var a=document.createElement("div");a.id="adm";a.setAttribute("role","dialog");
  a.innerHTML='<div class="admbox"><div class="admhead"><b>🛠 Админ-панель</b><button id="admX" aria-label="Закрыть">✕</button></div><div id="admBody"></div></div>';
  document.body.appendChild(a);
  a.addEventListener("click",function(e){
    if(e.target===a){closeAdmin();return}
    var b=e.target.closest&&e.target.closest("button");if(!b)return;
    if(b.id==="admX"){closeAdmin();return}
    act(b);
  });
  a.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&e.target.id==="admPw"){var g=a.querySelector('[data-a="login"]');if(g)act(g)}
    if(e.key==="Escape")closeAdmin();
  });
}
function checkHash(){if(isAdminHash())openAdmin();else{var a=$("#adm");if(a)a.classList.remove("on")}}

/* ================= запуск ================= */
var libStarted=false;
function startLib(){
  if(libStarted)return;libStarted=true;
  loadLib(0,function(ok){if(!ok){libStarted=false;mqttReady=false;setTimeout(startLib,8000);return}mqttReady=true;sub(T_CMD);link()});
}
var started=false;
function start(){
  if(started)return;started=true;
  ensureOv();ensureAdmin();
  startLib();
  setInterval(beat,HB_MS);
  setInterval(function(){applyBlk();if(isOpen())paintList()},2000);
  setInterval(function(){if(isOpen()){paintEv()}},3000);
  /* связь жива? если брокер молчит дольше минуты (даже своих сообщений нет), переподключаемся */
  setInterval(function(){if(connected&&cli&&now()-lastRx>60000&&now()-lastRx<1e12&&lastRx>0&&!document.hidden){lastRx=now();link()}},20000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){if(!connected&&mqttReady)link();beat()}});
  addEventListener("online",function(){if(mqttReady)link()});
  addEventListener("pagehide",function(){if(!adminMode())pub(T_HB,{id:PID,bye:1,ts:now()})});
  addEventListener("hashchange",checkHash);
  applyBlk();checkHash();
  window.MADLAB_LIVE={users:users,online:online,link:link,info:info};
}
if(document.readyState==="complete")start();else addEventListener("load",start);
})();
</script>
</body></html>
