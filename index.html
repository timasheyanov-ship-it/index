function diag(){
  var hidden=document.hidden,a=[],e;
  a.push(item("Ядро игры",ok()&&typeof shake==="function"&&typeof inv==="function"&&typeof say==="function","вещества, колба, сохранение"));
  a.push(item("Химия",typeof window.chemReact==="function"&&!!window.RXS,(window.RXS?window.RXS.length:0)+" реакций всего"));
  a.push(item("Новые реакции",RXOK&&rxCount()>0&&rxCount()===RXGOOD,rxCount()+" добавлено"));
  a.push(item("Нагрев и кипячение",HEATOK&&HEAT.length>0&&(hidden||Date.now()-st.beat<3000),HEAT.length+" правил"));
  a.push(item("Плита и зажигалка",!!(e=$("#stove"))&&!!$("#lighter")&&!!e.__m5&&!!$("#lighter").__m5,"ползунок, кнопка, табло"));
  a.push(item("Поиск",!!$("#invSearch")&&typeof inv==="function"&&!!inv.__s5,"поле и фильтр"));
  a.push(item("Предметы в колбе",!!$("#odrop")&&!!$("#osel")&&typeof OBJ!=="undefined","бросание предметов"));
  a.push(item("Мыши",!!$("#test")&&!!$("#mlist")&&Array.isArray(D.mice)&&typeof mice==="function","эксперименты"));
  a.push(item("Книга",typeof window.enc==="function"&&!!window.enc.__h5,"справочник"));
  a.push(item("Сохранение",storageOk(),"память браузера (без неё прогресс не сохранится)",true));
  a.push(item("Разбор правил",ERRS.length===0,ERRS.length?(ERRS.length+" с ошибками"):"без ошибок",true));
  return a;
}
function allGood(){return diag().every(function(x){return x.ok||x.warn})}
function updateDot(){return;var d=$("#admDot");if(!d)return;var g=allGood();d.style.background=g?"#39ff9c":"#ff4d4d";d.style.boxShadow="0 0 6px "+(g?"#39ff9c":"#ff4d4d");var b=$("#admBtn");if(b)b.title=g?"Админ-панель: всё подключено":"Админ-панель: есть разрыв соединения"}
function connBody(){
  var dg=diag();
  return dg.map(function(x){return'<div class="ln"><span class="led '+(x.ok?"ok":(x.warn?"warn":"bad"))+'"></span>'+esc(x.n)+' <span class="mut">'+esc(x.d)+'</span></div>'}).join("")+
    '<div class="b"><button data-a="reconnect" class="go">🔄 Переподключить всё</button></div>'+
    '<div class="mut">Автоконтроль проверяет связь каждые 2 секунды и сам восстанавливает плиту, поиск, кнопки, правила и справочник. Красный = что-то отвалилось (нажми «Переподключить»), жёлтый = не мешает игре.</div>'+
    (ERRS.length?'<div class="mut" style="margin-top:6px;color:#ff9a9a">Проблемы разбора: '+esc(ERRS.join("; "))+'</div>':"");
}
function refreshConn(){
  var a=$("#adm");if(!a||!a.classList.contains("on"))return;
  var c=$("#admConn");if(c)c.innerHTML=connBody();
  var t=$("#admConnT");if(t)t.textContent="🔌 Соединение: "+(allGood()?"всё подключено":"есть разрыв");
}

var armed=null,armT=0;
function danger(btn,msg,fn){
  if(armed===btn.dataset.a&&Date.now()-armT<4000){armed=null;fn();return}
  armed=btn.dataset.a;armT=Date.now();btn.textContent=msg;setTimeout(function(){if(armed===btn.dataset.a){armed=null;renderAdmin()}},4000);
}
function exportText(){try{return JSON.stringify(D)}catch(e){return"{}"}}
function admList(q){
  q=nz(q).trim();if(!q)return"";
  var r=results(q,24);
  return r.map(function(i){return'<button data-a="addsub" data-i="'+i+'">'+esc(S[i].e)+" "+esc(S[i].n)+'</button>'}).join("")||'<span class="mut">Ничего не найдено</span>';
}
var AQ="";
var ADMPW="madlab";            /* ПАРОЛЬ АДМИН-ПАНЕЛИ: поменяй здесь */
var unlocked=false;try{unlocked=sessionStorage.getItem("madlab_adm")==="1"}catch(e){}
function renderAdmin(){
  var b=$("#admBody");if(!b)return;
  if(!unlocked){
    b.innerHTML='<div class="mut" style="margin:6px 0">Введи пароль администратора.</div><input id="admPw" type="password" placeholder="Пароль" autocomplete="off"><div class="b"><button data-a="login" class="go">Войти</button></div><div id="admPwErr" class="mut" style="color:#ff9a9a"></div>';
    return;
  }
  var cur={};b.querySelectorAll("details").forEach(function(d){cur[d.dataset.d]=d.open});
  var det=function(id,title,html,def){var o=cur[id]!==undefined?cur[id]:def;return'<details data-d="'+id+'"'+(o?" open":"")+'><summary>'+title+'</summary>'+html+'</details>'};
  var h="";
  h+=det("conn",'<span id="admConnT">🔌 Соединение: '+(allGood()?"всё подключено":"есть разрыв")+'</span>','<div id="admConn">'+connBody()+'</div>',true);
  h+=det("prog","⭐ Прогресс",
    '<div class="mut">Уровень: '+lvl()+' · опыт: '+(Math.round(D.xp*100)/100)+' · колба вмещает '+cap()+'</div>'+
    '<div class="b"><button data-a="xp" data-v="10">+10 XP</button><button data-a="xp" data-v="100">+100 XP</button><button data-a="xp" data-v="500">+500 XP</button>'+
    '<button data-a="lvl4">Колба на 6 (ур. 4)</button>'+
    '<button data-a="unlock">🔓 Открыть все вещества</button><button data-a="unlockrx">📖 Открыть все реакции</button>'+
    '<button data-a="resetdisc" class="warn">Сбросить открытия</button><button data-a="resetall" class="warn">Стереть всё</button></div>',false);
  h+=det("flask","🧪 Колба",
    '<div class="b"><button data-a="shake">Встряхнуть</button><button data-a="clear">Слить</button></div>'+
    '<input id="admAddQ" type="search" placeholder="Найти вещество и налить…" autocomplete="off" value="'+esc(AQ)+'">'+
    '<div class="b" id="admAddRes">'+admList(AQ)+'</div>',false);
  h+=det("heat","🔥 Нагрев",
    '<div class="mut">Плита: '+st.T+' °C · ускорение ×'+st.spd+'</div>'+
    '<div class="b"><button data-a="temp" data-v="0">Выкл</button><button data-a="temp" data-v="50">50°</button><button data-a="temp" data-v="100">100°</button><button data-a="temp" data-v="160">160°</button><button data-a="temp" data-v="200">200°</button></div>'+
    '<div class="b"><button data-a="spd" data-v="1">×1</button><button data-a="spd" data-v="3">×3</button><button data-a="spd" data-v="10">×10</button><button data-a="coolfire">Погасить огонь</button></div>',false);
  h+=det("mice","🐭 Мыши",
    '<div class="b"><button data-a="revive">Оживить всех</button><button data-a="newmice">Новая поставка</button></div>',false);
  h+=det("save","💾 Сохранение",
    '<div class="b"><button data-a="export">Показать</button><button data-a="copy">Копировать</button><button data-a="download">Скачать файл</button></div>'+
    '<textarea id="admSave" rows="4" placeholder="Здесь появится сохранение. Для импорта вставь JSON и нажми «Применить»." spellcheck="false"></textarea>'+
    '<div class="b"><button data-a="import" class="warn">Применить (заменит прогресс)</button></div>',false);
  var lg=window.__errlog||[];
  h+=det("log","🪲 Журнал ошибок ("+lg.length+")",
    '<div class="log">'+(lg.length?lg.slice(-30).reverse().map(function(x){return'<div>'+esc(x)+'</div>'}).join(""):'<span class="mut">Ошибок нет</span>')+'</div>'+
    '<div class="b"><button data-a="clearlog">Очистить журнал</button></div>',false);
  b.innerHTML=h;
}
function openAdmin(){var a=$("#adm");if(!a)return;renderAdmin();a.classList.add("on");var p=$("#admPw");if(p)setTimeout(function(){try{p.focus()}catch(e){}},50)}
function closeAdmin(){var a=$("#adm");if(a)a.classList.remove("on");
  if(location.hash.toLowerCase()==="#admin"){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){location.hash=""}}}
function checkHash(){if(location.hash.toLowerCase()==="#admin")openAdmin();else{var a=$("#adm");if(a)a.classList.remove("on")}}
function act(btn){
  var a=btn.dataset.a,v=btn.dataset.v;
  try{
  switch(a){
    case"login":var pw=$("#admPw");if(pw&&pw.value===ADMPW){unlocked=true;try{sessionStorage.setItem("madlab_adm","1")}catch(e){}renderAdmin()}else{var er=$("#admPwErr");if(er)er.textContent="Неверный пароль.";if(pw){pw.value="";pw.focus()}}break;
    case"reconnect":ensureAll(true);renderAdmin();break;
    case"xp":gain(+v);renderAdmin();break;
    case"lvl4":if(D.xp<300){D.xp=300}hud();save();inv();say("Колба вмещает "+cap()+" веществ.");renderAdmin();break;
    case"unlock":S.forEach(function(s,i){D.disc[i]=1});save();inv();say("Все вещества открыты.");break;
    case"unlockrx":D.rx=D.rx||{};D.rxl=D.rxl||[];(window.RXS||[]).forEach(function(r,i){if(!D.rx[i]){D.rx[i]=1;D.rxl.push(i)}});D.hx=D.hx||{};HEAT.forEach(function(r){D.hx[r.id]=1});save();say("Все реакции и превращения записаны в Книгу.");break;
    case"resetdisc":danger(btn,"Точно? Нажми ещё раз",function(){D.disc={};D.seen={};D.rx={};D.rxl=[];D.hx={};D.mixes=[];save();inv();say("Открытия сброшены.");renderAdmin()});break;
    case"resetall":danger(btn,"Точно? Нажми ещё раз",function(){try{localStorage.removeItem("madlab1")}catch(e){}location.reload()});break;
    case"shake":$("#shake").click();break;
    case"clear":$("#pour").click();break;
    case"addsub":add(+btn.dataset.i);break;
    case"temp":setStove(+v);renderAdmin();break;
    case"spd":st.spd=+v;renderAdmin();break;
    case"coolfire":HEATK="";HEATT=0;st.stoveBoil=false;say("Огонь погашен.");break;
    case"revive":D.mice.forEach(function(m){m.dead=0;m.t="Здорова";m.st=0});save();if(typeof mice==="function")mice();say("Все мыши живы.");break;
    case"newmice":var dv=$("#deliv");if(dv)dv.click();break;
    case"export":var t=$("#admSave");if(t){t.value=exportText();t.select()}break;
    case"copy":var t2=$("#admSave");if(t2){if(!t2.value)t2.value=exportText();t2.select();try{navigator.clipboard&&navigator.clipboard.writeText(t2.value)}catch(e){}try{document.execCommand("copy")}catch(e){}btn.textContent="Скопировано";setTimeout(function(){btn.textContent="Копировать"},1500)}break;
    case"download":try{var bl=new Blob([exportText()],{type:"application/json"}),u=URL.createObjectURL(bl),l=document.createElement("a");l.href=u;l.download="madlab-save.json";document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove()},500)}catch(e){console.error(e)}break;
    case"import":var t3=$("#admSave");danger(btn,"Точно? Нажми ещё раз",function(){try{var o=JSON.parse(t3.value);if(!o||typeof o!=="object")throw 0;localStorage.setItem("madlab1",JSON.stringify(o));location.reload()}catch(e){btn.textContent="Не похоже на сохранение";setTimeout(renderAdmin,1500)}});break;
    case"clearlog":if(window.__errlog)window.__errlog.length=0;renderAdmin();break;
  }}catch(e){console.error(e)}
}
function ensureAdmin(){
  if(!$("#adm")){
    var a=document.createElement("div");a.id="adm";a.setAttribute("role","dialog");
    a.innerHTML='<div class="admbox"><div class="admhead"><b>🛠 Админ-панель</b><button id="admX" aria-label="Закрыть">✕</button></div><div id="admBody"></div></div>';
    document.body.appendChild(a);
    a.addEventListener("click",function(e){
      if(e.target===a){closeAdmin();return}
      var b=e.target.closest&&e.target.closest("button");if(!b)return;
      if(b.id==="admX"){closeAdmin();return}
      if(b.dataset.a)act(b);
    });
    a.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="admPw"){var g=a.querySelector('[data-a="login"]');if(g)act(g)}});
    a.addEventListener("input",function(e){if(e.target.id==="admAddQ"){AQ=e.target.value;var r=$("#admAddRes");if(r)r.innerHTML=admList(AQ)}});
  }
  var old=$("#admBtn");if(old)old.remove();
}

/* ================= ЖУРНАЛ ОШИБОК ================= */
function hookErrors(){
  if(!window.__errlog)window.__errlog=[];
  if(window.__errHooked)return;window.__errHooked=1;
  var push=function(s){var l=window.__errlog;l.push(new Date().toLocaleTimeString()+" · "+s);if(l.length>100)l.shift()};
  try{var ce=console.error;console.error=function(){try{push(Array.prototype.map.call(arguments,function(x){return x&&x.message?x.message:String(x)}).join(" "))}catch(e){}return ce.apply(console,arguments)}}catch(e){}
}

/* ================= ПОДКЛЮЧЕНИЕ ================= */
function ensureAll(force){
  if(!ok())return false;
  var steps=[
    function(){if(force||!SUBOK)addSubstances()},
    function(){cacheIds()},
    function(){migrate()},
    function(){addReactions()},
    function(){addHeat()},
    function(){ensureStove()},
    function(){ensureSearch()},
    function(){wrapEnc()},
    function(){ensureAdmin()},
    function(){updateDot();refreshConn()}
  ];
  steps.forEach(function(f){try{f()}catch(e){console.error("MAD LAB v5:",e)}});
  return true;
}
var started=false;
function start(){
  if(started)return;started=true;
  hookErrors();
  var tries=0;
  (function boot(){
    var ready=ok()&&!!window.RXS&&!!$("#flsel");
    if(ready||tries>40){ensureAll(true);try{inv()}catch(e){}checkHash()}
    else{tries++;setTimeout(boot,150);return}
  })();
  setInterval(tick,200);
  setInterval(function(){ensureAll(false)},2000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){st.last=Date.now();st.beat=Date.now();ensureAll(false)}});
  addEventListener("hashchange",checkHash);
  addEventListener("pageshow",function(){ensureAll(false)});
  window.MADLAB5={ver:DATAV,state:st,diag:diag,ensure:ensureAll,heat:function(){return HEAT},errors:ERRS,open:openAdmin};
}
if(document.readyState==="complete")start();else addEventListener("load",start);
})();
</script>
</body></html>
