function login(){root.innerHTML='<div style="max-width:340px;margin:18vh auto;text-align:center"><h2>👑 Админка MAD LAB</h2><input id="ap" type="password" placeholder="Пароль" style="width:100%;padding:12px;border-radius:10px;border:1px solid #2a2344;background:#120f1f;color:#fff;font:inherit"><button class="g" id="ab" style="width:100%;margin-top:10px">Войти</button><div id="ae" style="color:#ff4a4a;margin-top:8px"></div></div>';

var ss=0,pt=0,lastIn=0;function onSt(s){if(s==1)ss=1;else if(s==3)ss=0;else if(s==2)pt=Date.now();else pt=0}
function onUp(d){if(!d||!d.u)return;lastIn=Date.now();if(d.t=="st")G[d.u]=Object.assign(G[d.u]||{ev:[]},d,{last:Date.now()});else if(d.t=="evt"){var g=G[d.u]=G[d.u]||{u:d.u,n:d.u,ev:[],last:Date.now(),lk:[]};g.ev.unshift(new Date().toTimeString().slice(0,5)+" "+d.e);g.ev.length=Math.min(g.ev.length,5)}}
function stat(){var s=ss?"🟢 На связи (SSE)":(pt&&Date.now()-pt<25000)?"🟡 На связи (опрос)":"🔴 Нет связи с ntfy.sh";if(TX.err)s+=" · ⚠️ "+TX.err;s+=lastIn?" · данные "+Math.round((Date.now()-lastIn)/1000)+" с назад":" · данных пока нет";return s}
function start(){pw=true;sub(UP,"90s",onUp,onSt);setTimeout(function(){pub(DN,{to:"*",c:"ping"},true)},1500);draw();setInterval(draw,1500)}
function tell(u,m){m.to=u;pub(DN,m,true)}
function every(m){m.to="*";pub(DN,m,true)}
function live(g){return g.last&&Date.now()-g.last<80000}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function draw(){if(!pw)return;var ks=Object.keys(G).filter(function(k){return G[k].last&&Date.now()-G[k].last<300000}).sort(function(a,b){return G[b].last-G[a].last}),n=ks.filter(function(k){return live(G[k])}).length;
var h='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">👑 Админка</h2><b>👥 '+n+'</b></div><div class="sm">'+stat()+'</div>'+
'<div class="gc"><b>Всем сразу</b><div class="rw"><button data-a="gv">🎬 Видео всем</button><button data-a="gs">⏹ Стоп видео</button><button data-a="gm">💬 Сообщение всем</button><button data-a="rf">🔄 Обновить список</button><button data-a="gl">🔒 Заблокировать всё</button><button data-a="gu">🔓 Разблокировать всё</button></div></div>';
if(!ks.length)h+='<p class="sm">Пока никого нет. Гости появляются в течение ~30 секунд после открытия сайта. Нажми «🔄 Обновить список».</p>';
ks.forEach(function(k){var g=G[k],o=open[k],on=live(g),mins=Math.max(0,Math.round((Date.now()-(g.t0||Date.now()))/60000));
h+='<div class="gc" data-u="'+k+'"><div data-a="tg"><i class="dot '+(on?"on":"")+'"></i><b>'+esc(g.n)+'</b> '+(g.ban?"⛔ ":"")+(g.vid?"🎬 ":"")+(g.h?"💤 ":"")+'<div class="sm">'+esc(g.d)+" · "+esc(g.tab)+" · ур."+g.lv+" · "+mins+" мин"+(g.lk&&g.lk.length?" · 🔒"+g.lk.length:"")+'</div></div>';
if(o){h+='<div class="sm">🧪 В колбе: '+esc(g.fl||"пусто")+'</div>'+(g.ev&&g.ev.length?'<div class="sm">'+g.ev.map(esc).join("<br>")+"</div>":"")+
'<div class="rw"><button data-a="vd">🎬 Видео</button><button data-a="st">⏹ Стоп</button><button data-a="ms">💬 Сообщение</button></div><div class="sm">Заблокировать кнопки:</div><div class="rw">'+
Object.keys(LK).map(function(x){return'<button data-a="lk" data-k="'+x+'" class="'+((g.lk||[]).indexOf(x)>=0?"on":"")+'" style="flex:1 1 30%">'+((g.lk||[]).indexOf(x)>=0?"🔒 ":"")+LK[x]+"</button>"}).join("")+
'</div><div class="rw"><button class="r" data-a="ki">🚪 Выгнать</button>'+(g.ban?'<button class="g" data-a="ub">✅ Разбанить</button>':'<button class="r" data-a="bn">⛔ Бан</button>')+"</div>"}
h+="</div>"});
if(root.querySelector("input")&&document.activeElement&&document.activeElement.tagName=="INPUT")return;root.innerHTML=h}
root.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,c=b.closest("[data-u]"),u=c&&c.dataset.u,g=u&&G[u],v;
if(a=="tg"){open[u]=!open[u]}
else if(a=="vd"||a=="gv"){v=prompt("Ссылка на видео (mp4 или YouTube):",LS("madlab_vurl")||"");if(v){LS("madlab_vurl",v);a=="gv"?every({c:"video",v:v}):tell(u,{c:"video",v:v})}}
else if(a=="st")tell(u,{c:"stop"});else if(a=="gs")every({c:"stop"});
else if(a=="ms"||a=="gm"){v=prompt("Сообщение:");if(v)a=="gm"?every({c:"msg",v:v}):tell(u,{c:"msg",v:v})}
else if(a=="lk"){var l=(g.lk||[]).slice(),i=l.indexOf(b.dataset.k);i>=0?l.splice(i,1):l.push(b.dataset.k);g.lk=l;tell(u,{c:"lock",v:l})}
else if(a=="rf")every({c:"ping"});else if(a=="gl")every({c:"lock",v:["all"]});else if(a=="gu")every({c:"lock",v:[]});
else if(a=="ki"){if(confirm("Выгнать "+g.n+"?"))tell(u,{c:"kick"})}
else if(a=="bn"){if(confirm("Забанить "+g.n+"?"))tell(u,{c:"ban"})}
else if(a=="ub")tell(u,{c:"unban"});
draw()});
try{if(sessionStorage.getItem("madlab_adm")==="1")start();else login()}catch(e){login()}
}
if(isAdm)admin();else visitor();
})();
